services:
  - type: web
    name: attendly-smart-attendance
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --worker-class gthread --threads 8 --timeout 120 app:app
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ATTENDANCE_DATABASE
        value: /tmp/attendance.db
      - key: ATTENDANCE_REQUIRE_AUTH
        value: "true"
      - key: ATTENDANCE_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ATTENDANCE_CAMERA_ENABLED
        value: "false"
      - key: ATTENDANCE_TIMEZONE
        value: Asia/Kolkata
